name: PvPTime
main: com.guichaguri.pvptime.bukkit.PvPTimeBukkit
version: ${version}
api-version: 1.7.10
description: Lets you choose what in-game time you want PvP enabled.
softdepend:
- WorldGuard
- Towny
- FlagWar
- SiegeWar
authors:
- Guichaguri
- Erbros
website: https://github.com/Guichaguri/PvPTime
commands:
  pvptime:
    description: Information regarding usage of PvPTime.
    usage: /<command> [info/reload]
permissions:
  pvptime.*:
    description: Full access to all PvPTime features.
    children:
      pvptime.nopvp: true
      pvptime.override: true
      pvptime.reload: true
      pvptime.info.current: true
      pvptime.info.all: true
  pvptime.nopvp:
    description: Disable PvP for a player even in nighttime.
    default: false
  pvptime.override:
    description: Let the player deal damage even when it's not pvp time.
    default: false
  pvptime.reload:
    description: Reload the configuration file.
    default: op
  pvptime.info:
    description: Get PvPTime info.
    children:
      pvptime.info.current: true
      pvptime.info.all: true
  pvptime.info.current:
    description: Get info for the current world.
    default: true
  pvptime.info.all:
    description: Get info for all worlds.
    default: true
