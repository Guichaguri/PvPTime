plugins {
    id 'java'
    id 'signing'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'com.guichaguri.pvptime'
version = ver

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()

    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content { includeGroup 'org.spongepowered' }
    }
    maven {
        name = 'spigot'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
        content { includeGroup 'org.spigotmc' }
    }
    maven {
        name = 'enginehub'
        url = 'https://maven.enginehub.org/repo/'
    }
    maven {
        name = 'glaremasters-towny'
        url = 'https://repo.glaremasters.me/repository/towny/'
        content { includeGroup 'com.palmergames.bukkit.towny' }
    }
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.TownyAdvanced' }
    }
    maven {
        name = 'aspect-repo'
        url = 'https://maven.aspect-realms.ru/repository/maven-public/'
        content { includeGroup 'com.github.SawFowl' }
    }
}

dependencies {
    // Common
    implementation project(':common')

    // Sponge
    compileOnly 'org.spongepowered:spongeapi:17.0.0'

    // Bukkit
    compileOnly 'org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT'

    // WorldGuard and WorldEdit (Bukkit Plugin)
    compileOnly ('com.sk89q.worldguard:worldguard-core:7.0.17-SNAPSHOT') {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    compileOnly('com.sk89q.worldguard:worldguard-bukkit:7.0.17-SNAPSHOT') {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    // Towny (Bukkit Plugin)
    compileOnly 'com.palmergames.bukkit.towny:towny:0.103.0.6'
    compileOnly 'com.github.TownyAdvanced:FlagWar:0.8.1'
    compileOnly('com.github.TownyAdvanced:SiegeWar:3.6.1') {
        exclude group: 'us.dynmap', module: 'dynmap-api'
    }

    // RegionGuard (Sponge Plugin)
    //compileOnly files('./libs/RegionGuard-4.4.1.jar')
    compileOnly 'com.github.SawFowl:RegionGuard:4.4.1'
}

// Built-in Gradle resource filtering (replaces the SnakeYAML workaround)
// To use this, change your src/main/resources/plugin.yml version line to:
// version: '${version}'
processResources {
    def props = [version: project.version]
    inputs.properties props
    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }

    filesMatching('META-INF/sponge_plugins.json') {
        expand props
    }
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveClassifier = ''
    archiveBaseName = 'PvPTime'
}

signing {
    sign tasks.named('shadowJar').get()
}